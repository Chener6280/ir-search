[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-search"
version = "0.2.0rc1"
description = "Deterministic investment research search kernel"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0", "tzdata; platform_system == 'Windows'"]

[project.scripts]
ir-search = "ir_search.__main__:main"
ir-search-mcp = "ir_search.mcp_server:run"
ir-search-wechat = "ir_search.clients.wechat_articles:main"
ir-search-acceptance = "ir_search.acceptance:main"
ir-search-gangtise-login = "ir_search.infrastructure.gangtise_auth:main"
ir-search-doctor = "ir_search.services.source_diagnostics:main"

[project.optional-dependencies]
dev = ["pytest>=8", "setuptools>=61", "wheel"]
mcp = ["mcp>=1,<2"]
mysql = ["PyMySQL>=1.1.1,<2"]
akshare = ["akshare>=1.18,<2"]
extract = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "PyMuPDF>=1.24",
  "trafilatura>=1.12",
]
browser = ["playwright>=1.49"]
crawl = ["crawl4ai==0.9.3; python_version >= '3.10'"]
scrapling = ["scrapling==0.4.15; python_version >= '3.10'"]
video = ["youtube-transcript-api==1.2.4"]
audio = ["websockets==15.0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: optional tests that require live provider configuration or network access",
]

[tool.setuptools.packages.find]
include = ["ir_search*"]

[tool.setuptools.package-data]
ir_search = ["configs/*.yaml", "entities/*.csv"]

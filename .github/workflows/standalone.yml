name: Standalone package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            utf8: "1"
          - os: ubuntu-latest
            python: "3.12"
            utf8: "1"
          - os: macos-latest
            python: "3.12"
            utf8: "1"
          - os: windows-latest
            python: "3.12"
            utf8: "1"
          # What a Windows user actually runs: no UTF-8 mode, the locale code page decides.
          - os: windows-latest
            python: "3.12"
            utf8: "0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: ${{ matrix.utf8 }}
      IR_SEARCH_LIVE: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install shell required by legacy Cursor workspace tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install ".[dev,mcp,mysql]"
      - name: Installed package without checkout or local skills
        run: python -m pytest tests/test_standalone_package.py -q
      # Tests that need POSIX mode bits, symlink privilege or the zsh wrapper skip themselves
      # with a stated reason; nothing is left unrun because of the operating system.
      - name: Full offline suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -m "not live" -q -rfE 2>&1 | tee pytest-report.log
      # Job logs need a signed-in reader; annotations do not. Put the failing test ids and
      # their one-line reasons where anyone looking at the run can see them.
      - name: Publish failing tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -aE '^(FAILED|ERROR) ' pytest-report.log | cut -c1-300 > failures.txt || true
          echo "failing tests: $(wc -l < failures.txt)"
          split -l 12 failures.txt failures_part_ || true
          for part in failures_part_*; do
            [ -f "$part" ] || continue
            message=$(sed -e 's/%/%25/g' "$part" | tr '\n' '\r' | sed -e 's/\r/%0A/g')
            echo "::error title=pytest failures (${{ matrix.os }}, utf8=${{ matrix.utf8 }})::${message}"
          done

fallbacks:
  bocha: [anysearch, searxng, web_search]
  exa: [tavily, anysearch, searxng, web_search]
  tavily: [anysearch, searxng, web_search]
  anysearch: [searxng, web_search]
  searxng: [web_search]
  tushare: [longbridge, market_public]
  longbridge: [market_public]

error_classes:
  quota:
    - api key
    - quota
    - exhausted
    - limit
    - rate
    - "401"
    - "402"
    - "403"
    - "429"
  network:
    - timeout
    - timed out
    - network
    - request failed
    - urlopen
    - connection

web_material_chain:
  failover_on: [quota, rate_limit, network, timeout, tls_error, authentication_failed, entitlement_denied, upstream_schema, web_content_challenge]
  failover_on_empty: false
  caller_handoff: quota_after_entire_chain_failed
  anonymous_api_retry: false
